name: Build Windows DLL

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Dependências do Lua 5.5 e Headers
        shell: powershell
        run: |
          # 1. Garante o protocolo TLS 1.2 para conexões de rede seguras
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          # 2. Cria a estrutura de diretorias necessária
          New-Item -ItemType Directory -Force -Path "D:\LuaLib\include" | Out-Null

          # 3. Baixa e extrai o Runtime dos Binários Oficiais do Lua
          $binUrl = "https://downloads.sourceforge.net/project/luabinaries/5.4.6/Executables/lua-5.4.6_Win64_bin.zip"
          Invoke-WebRequest -Uri $binUrl -OutFile "D:\LuaLib\lua.zip" -UserAgent "Mozilla/5.0"
          Expand-Archive -Path "D:\LuaLib\lua.zip" -DestinationPath "D:\LuaLib" -Force

          # 4. Baixa e extrai os Ficheiros de Cabeçalho C (lua.h, lauxlib.h, luaconf.h)
          $incUrl = "https://downloads.sourceforge.net/project/luabinaries/5.4.6/Includes/lua-5.4.6_Win64_inl.zip"
          Invoke-WebRequest -Uri $incUrl -OutFile "D:\LuaLib\include.zip" -UserAgent "Mozilla/5.0"
          Expand-Archive -Path "D:\LuaLib\include.zip" -DestinationPath "D:\LuaLib\include" -Force

      - name: Compilar sysmetrics.dll
        shell: cmd
        run: |
          gcc -O2 -shared -o sysmetrics.dll sysmetrics.c -I"D:\LuaLib\include" -L"D:\LuaLib" -llua54

      - name: Disponibilizar DLL para Download
        uses: actions/upload-artifact@v4
        with:
          name: sysmetrics-dll
          path: sysmetrics.dll
